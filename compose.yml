---
services:
  db:
    image: krishnadevops118/python_library_dbimage
    ports:
      - "3306:3306"
    deploy:
      replicas: 2  
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - network1

  auth_service:
    image: krishnadevops118/python_library_authimage
    ports:
      - "5001:5001"
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: "0.25"
          memory: 200M
        limits:
          cpus: "0.5"
          memory: 300M  
    networks:
      - network1
    depends_on:
      - db

  book_service:
    image: krishnadevops118/python_library_bookimage
    ports:
      - "5002:5002"
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: "0.25"
          memory: 200M
        limits:
          cpus: "0.5"
          memory: 300M  
    networks:
      - network1
    depends_on:
      - db  

  borrow_service:
    image: krishnadevops118/python_library_borrowimage
    ports:
      - "5003:5003"
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: "0.25"
          memory: 200M
        limits:
          cpus: "0.5"
          memory: 300M  
    networks:
      - network1
    depends_on:
      - db    
      
  frontend:
    image: krishnadevops118/python_library_appimage
    ports:
      - "5000:5000"
    networks:
      - network1
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: "0.25"
          memory: 200M  
    depends_on:
      - auth_service
      - book_service
      - borrow_service   


networks:
  network1:
    driver: overlay
volumes:
  mydata:  
...
